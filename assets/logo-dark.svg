<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 440 120" width="440" height="120"
     role="img" aria-label="ClipBridge — iPad and Mac clipboard, made reliable">
  <title>ClipBridge</title>
  <g transform="translate(6,8)">
    <!-- Outer arch, then the paperclip's fold back at the left. -->
    <path d="M 88 74 C 88 4 10 4 10 56 C 10 70 30 70 30 56"
          fill="none" stroke="#E6EDF3" stroke-width="5.5"
          stroke-linecap="round" stroke-linejoin="round"/>
    <!-- The same wire returning as the inner arch, ending free above the
         deck the way a paperclip's inner loop does. -->
    <path d="M 30 56 C 30 26 70 26 70 62"
          fill="none" stroke="#2DD4BF" stroke-width="5.5" stroke-linecap="round"/>
    <path d="M 6 74 H 90" fill="none" stroke="#E6EDF3" stroke-width="5.5" stroke-linecap="round"/>
    <path d="M 20 74 V 86 M 76 74 V 86" fill="none" stroke="#E6EDF3" stroke-width="5" stroke-linecap="round"/>
  </g>
  <g font-family="ui-sans-serif, -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif">
    <text x="120" y="62" font-size="44" font-weight="650" letter-spacing="-1.2" fill="#E6EDF3">ClipBridge</text>
    <text x="122" y="89" font-size="14.5" font-weight="500" letter-spacing="0.6" fill="#8B949E">iPad &#8646; Mac clipboard, made reliable</text>
  </g>
</svg>
