<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" width="120" height="120"
     role="img" aria-label="ClipBridge">
  <title>ClipBridge</title>
  <style>
    :root { --ink: #1B1F24; --accent: #0F9E90; }
    @media (prefers-color-scheme: dark) {
      :root { --ink: #E6EDF3; --accent: #2DD4BF; }
    }
  </style>
  <g transform="translate(0,12)">
      <defs>
        <!-- The lower crossing, where the accent link passes back over the ink
             one. Without this the two shapes merely overlap and read flat. -->
        <clipPath id="cbI"><circle cx="60" cy="65" r="10"/></clipPath>
      </defs>
      <rect x="48" y="30" width="62" height="36" rx="18" fill="none" stroke="var(--accent)" stroke-width="7"/>
      <rect x="10" y="30" width="62" height="36" rx="18" fill="none" stroke="var(--ink)" stroke-width="7"/>
      <g clip-path="url(#cbI)">
        <rect x="48" y="30" width="62" height="36" rx="18" fill="none" stroke="var(--accent)" stroke-width="7"/>
      </g>
  </g>
</svg>
