<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 96 96" width="96" height="96"
     role="img" aria-label="ClipBridge">
  <title>ClipBridge</title>
  <style>
    :root { --ink: #1B1F24; --accent: #0F9E90; }
    @media (prefers-color-scheme: dark) {
      :root { --ink: #E6EDF3; --accent: #2DD4BF; }
    }
  </style>
  <g transform="translate(0,-4)">
    <!-- Outer arch, then the paperclip's fold back at the left. -->
    <path d="M 88 74 C 88 4 10 4 10 56 C 10 70 30 70 30 56"
          fill="none" stroke="var(--ink)" stroke-width="5.5"
          stroke-linecap="round" stroke-linejoin="round"/>
    <!-- The same wire returning as the inner arch, ending free above the
         deck the way a paperclip's inner loop does. -->
    <path d="M 30 56 C 30 26 70 26 70 62"
          fill="none" stroke="var(--accent)" stroke-width="5.5" stroke-linecap="round"/>
    <path d="M 6 74 H 90" fill="none" stroke="var(--ink)" stroke-width="5.5" stroke-linecap="round"/>
    <path d="M 20 74 V 86 M 76 74 V 86" fill="none" stroke="var(--ink)" stroke-width="5" stroke-linecap="round"/>
  </g>
</svg>
