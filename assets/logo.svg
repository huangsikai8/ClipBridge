<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 440 120" width="440" height="120"
     role="img" aria-label="ClipBridge — iPad and Mac clipboard, made reliable">
  <title>ClipBridge</title>
  <!-- Turned 45°: the conventional orientation for a link, and it squares the
       mark up so it balances the wordmark. -->
  <g transform="translate(64,60) scale(0.9) rotate(-45) translate(-60,-48)">
      <defs>
        <!-- The lower crossing, where the accent link passes back over the ink
             one. Without this the two shapes merely overlap and read flat. -->
        <clipPath id="cbA"><circle cx="60" cy="65" r="10"/></clipPath>
      </defs>
      <rect x="48" y="30" width="62" height="36" rx="18" fill="none" stroke="#0F9E90" stroke-width="7"/>
      <rect x="10" y="30" width="62" height="36" rx="18" fill="none" stroke="#1B1F24" stroke-width="7"/>
      <g clip-path="url(#cbA)">
        <rect x="48" y="30" width="62" height="36" rx="18" fill="none" stroke="#0F9E90" stroke-width="7"/>
      </g>
  </g>
  <g font-family="ui-sans-serif, -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif">
    <text x="140" y="62" font-size="44" font-weight="650" letter-spacing="-1.2" fill="#1B1F24">ClipBridge</text>
    <text x="142" y="89" font-size="14.5" font-weight="500" letter-spacing="0.6" fill="#6A737D">iPad &#8646; Mac clipboard, made reliable</text>
  </g>
</svg>
